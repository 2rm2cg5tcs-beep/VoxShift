name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC, x64, static CRT)
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: DSP tests
        shell: pwsh
        run: |
          build\Release\dsp_tests.exe 2>&1 | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) { throw "dsp tests failed" }

      - name: Self-test of the app (audio chain + device enumeration)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\Release\Pressvppp.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
          "selftest OK"

      - name: UI screenshots (every page)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process -FilePath build\Release\Pressvppp.exe -ArgumentList '--screenshot', "$PWD\shots" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); "screenshot run timed out" | Out-File shots\timeout.txt }
          "exit code: $($p.ExitCode)" | Out-File shots\exitcode.txt
          $log = Join-Path $env:APPDATA 'Pressvppp\pressvppp.log'
          if (Test-Path $log) { Copy-Item $log shots\pressvppp.log }
          Get-ChildItem shots

      - name: Publish screenshots (pre-release "ci-screenshots")
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'   # PS 5.1: redirected native stderr must not abort
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem shots\*.bmp | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $img.Save(($_.FullName -replace '\.bmp$', '.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $img.Dispose()
          }
          gh release delete ci-screenshots --yes --cleanup-tag
          $files = @(Get-ChildItem shots\* -Include *.png, *.log, *.txt | ForEach-Object { $_.FullName })
          if ($files.Count -gt 0) {
            gh release create ci-screenshots $files --title "CI screenshots" --notes "UI screenshots from the latest build" --prerelease
          }
          exit 0

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer\Pressvppp.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Pressvppp_Setup
          path: Output/Pressvppp_Setup.exe

      - name: Publish "latest" release (direct download link)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item build\Release\Pressvppp.exe Pressvppp_portable.exe
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          $notes = "Автоматическая сборка из main ($env:GITHUB_SHA).`n`nPressvppp_Setup.exe — установщик (рекомендуется).`nPressvppp_portable.exe — запуск без установки."
          gh release create latest Output/Pressvppp_Setup.exe Pressvppp_portable.exe --title "Pressvppp — последняя сборка" --notes $notes --latest

      - name: Publish logs on failure (pre-release "ci-logs")
        if: failure() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-logs --yes --cleanup-tag 2>$null
          $files = @('build.log', 'tests.log') | Where-Object { Test-Path $_ }
          if ($files.Count -gt 0) { gh release create ci-logs $files --title "CI logs" --notes "Logs of the last failed build" --prerelease }
          exit 0
